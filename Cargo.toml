[package]
name = "brainproxy-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license-file = "LICENSE.md"
description = "A small scan service for brainproxy: scans a registered target, compares with the previous scan, and gates"
repository = "https://github.com/r4nd0mth1ngs/brainproxy_server"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
http-body-util = "0.1.5"
libc = "0.2.191"
ring = "0.17"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "process", "signal", "sync", "time", "rt-multi-thread", "net", "fs", "io-util"] }
ureq = { version = "3.5.0", features = ["platform-verifier", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
