[package]
name = "brainproxy-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license-file = "LICENSE.md"
description = "A small scan service for brainproxy: scans a registered target, compares with the previous scan, and gates"
repository = "https://github.com/r4nd0mth1ngs/brainproxy_server"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
