# One pod, one ReadWriteOnce volume for /work. Never more than one replica: control.db (SQLite) and
# the project files are locked by the one server that owns the volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: brainproxy-server
  labels:
    app.kubernetes.io/name: brainproxy-server
spec:
  replicas: 1
  serviceName: brainproxy-server
  selector:
    matchLabels:
      app.kubernetes.io/name: brainproxy-server
  # A StatefulSet replaces its pod by deleting the old one first, so two servers never share the
  # volume during an upgrade.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # Keep the volume when the StatefulSet is deleted or scaled to 0.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brainproxy-server
    spec:
      serviceAccountName: brainproxy-server
      automountServiceAccountToken: false
      enableServiceLinks: false
      # On SIGTERM the server stops its listeners (up to 5 s) and exits; scans running in the pod
      # end with it and those runs end incomplete. The rest is room for the last upload to the
      # object store, if one is set.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: brainproxy-server
          # Built from docker/server.Dockerfile; set OWNER and TAG in kustomization.yaml.
          image: ghcr.io/OWNER/brainproxy-server:TAG
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --listen=0.0.0.0:9090
            # Loopback only: reach it with kubectl port-forward or kubectl exec (README.md).
            - --admin-listen=127.0.0.1:9091
            - --admin-token-file=/run/brainproxy-admin/token
            - --secrets-dir=/run/secrets
            # The Ingress controller sets X-Forwarded-For. Remove this flag without an Ingress.
            - --trust-forwarded
          # Object storage (image built with --build-arg CARGO_FEATURES=object-store). The server
          # uploads control.db, snapshots and runs there and restores from it into an empty /work.
          # - name: BRAINPROXY_SERVER_STORE
          #   value: s3://my-bucket/brainproxy        # or az://container/prefix
          # envFrom:
          #   - secretRef:
          #       name: brainproxy-store              # AWS_* or AZURE_STORAGE_* credentials
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          startupProbe:
            # Restoring from the object store happens before the listeners start.
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Scans run as brainproxy CLI processes in this container, up to --max-parallel (3) at
          # once. Raise the memory with --max-parallel or with thorough presets.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: admin-token
              mountPath: /run/brainproxy-admin
              readOnly: true
            # Target secrets: one directory per target, one file per variable, so that
            # /run/secrets/<target>/<VARIABLE> exists (README.md, "Secrets"). An example:
            - name: target-shop-dev
              mountPath: /run/secrets/shop-dev
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: admin-token
          secret:
            secretName: brainproxy-admin
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: target-shop-dev
          secret:
            secretName: brainproxy-target-shop-dev
            defaultMode: 0440
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: work
        labels:
          app.kubernetes.io/name: brainproxy-server
      spec:
        # Block storage only (EBS, Azure Disk, Persistent Disk, local). No NFS, EFS or Azure Files:
        # the server refuses a network filesystem. With a CSI driver, ReadWriteOncePod is stricter.
        accessModes: [ReadWriteOnce]
        # storageClassName: gp3
        resources:
          requests:
            storage: 20Gi
