# The server never calls the Kubernetes API, so the pod gets no token. For S3 or Azure Blob through
# workload identity (EKS IRSA or Pod Identity, AKS Workload Identity), annotate this account as your
# platform documents; those mount their own token and don't need the automounted one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brainproxy-server
  labels:
    app.kubernetes.io/name: brainproxy-server
automountServiceAccountToken: false
